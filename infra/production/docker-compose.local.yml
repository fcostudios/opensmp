# Localhost rehearsal only: trust/export this CA, never disable TLS validation.
services:
  caddy:
    ports: !override
      - "127.0.0.1:18080:18080"
      - "127.0.0.1:18443:18443"
    volumes:
      - ./production/Caddyfile.local:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases: [ledger.localhost, auth.localhost]
  app:
    environment:
      AUTH_URL: https://ledger.localhost:18443
      NEXTAUTH_URL: https://ledger.localhost:18443
      LEDGER_PUBLIC_URL: https://ledger.localhost:18443
      KEYCLOAK_ISSUER: https://auth.localhost:18443/realms/corporativo
      NODE_EXTRA_CA_CERTS: /run/local-ca/root.crt
    volumes:
      - ${LOCAL_CA_DIR:?set LOCAL_CA_DIR}:/run/local-ca:ro
  keycloak:
    environment:
      KC_HOSTNAME: https://auth.localhost:18443
      LEDGER_PUBLIC_URL: https://ledger.localhost:18443
  worker:
    environment:
      LEDGER_PUBLIC_URL: https://ledger.localhost:18443
