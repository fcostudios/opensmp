# Extend with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: app-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nous.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  postgres:
    ports:
      - "5432:5432"

  keycloak:
    environment:
      KC_LOG_LEVEL: DEBUG

  redis:
    ports:
      - "6379:6379"
