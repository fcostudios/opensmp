services:
  smtp-relay:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/livez >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15
