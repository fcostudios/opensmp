name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      TESTCONTAINERS_RYUK_DISABLED: "true"
      POSTGRES_SUPERUSER_PASSWORD: ci-superuser-password
      LEDGER_OWNER_PASSWORD: ci-owner-password
      LEDGER_APP_PASSWORD: ci-app-password
      DATABASE_ADMIN_URL: postgresql://ledger_owner:ci-owner-password@127.0.0.1:5432/ledger_ci
      DATABASE_URL: postgresql://ledger_app:ci-app-password@127.0.0.1:5432/ledger_ci
      DB_DRIVER: pg
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate routes
        run: pnpm validate:routes

      - name: Validate sidebar
        run: pnpm validate:sidebar

      - name: Provision migration and runtime roles
        env:
          PGPASSWORD: ${{ env.POSTGRES_SUPERUSER_PASSWORD }}
        run: |
          psql --host=127.0.0.1 --username=postgres --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --set=owner_password="$LEDGER_OWNER_PASSWORD" \
            --command="CREATE ROLE ledger_owner LOGIN CREATEDB PASSWORD :'owner_password'"
          psql --host=127.0.0.1 --username=postgres --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --set=app_password="$LEDGER_APP_PASSWORD" \
            --command="CREATE ROLE ledger_app LOGIN PASSWORD :'app_password'"
          psql --host=127.0.0.1 --username=postgres --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="CREATE DATABASE ledger_ci OWNER ledger_owner"

      - name: Apply committed migrations as ledger_owner
        run: pnpm --filter @smp/db db:migrate

      - name: Verify migrated schema and runtime grant state
        run: pnpm --filter @smp/db db:verify

      - name: Verify current ledger_app grant baseline using ledger_app
        env:
          PGPASSWORD: ${{ env.LEDGER_APP_PASSWORD }}
        run: |
          grant_state="$(psql --host=127.0.0.1 --username=ledger_app --dbname=ledger_ci \
            --no-align --tuples-only --set=ON_ERROR_STOP=1 \
            --command="SELECT current_user = 'ledger_app' AND NOT has_table_privilege(current_user, 'public.company', 'SELECT')")"
          test "${grant_state//[[:space:]]/}" = "t"

      - name: Compare committed migrations with drizzle-kit push
        run: pnpm --filter @smp/db db:parity
